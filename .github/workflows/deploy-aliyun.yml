name: CI and deploy to Alibaba Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      architecture:
        description: Alibaba Cloud server CPU architecture
        type: choice
        options: [x64, arm64]
        default: x64
        required: true

permissions:
  contents: read

concurrency:
  group: mind-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Package self-contained Linux release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_ARCH: ${{ inputs.architecture }}
        run: npm run package:release -- --sha "$GITHUB_SHA" --arch "$DEPLOY_ARCH"
      - name: Upload verified release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mind-release-${{ github.sha }}
          path: |
            .release/mind-release.tar.gz
            .release/mind-release.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy mind.made-world.link
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download verified release
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: mind-release-${{ github.sha }}
          path: artifact
      - name: Deploy through SSH and verify HTTPS
        env:
          DEPLOY_HOST: ${{ vars.ALIYUN_HOST || '47.90.84.89' }}
          DEPLOY_USER: ${{ vars.ALIYUN_USER || 'root' }}
          DEPLOY_PORT: ${{ vars.ALIYUN_PORT || '22' }}
          DEPLOY_DOMAIN: ${{ vars.MIND_DOMAIN || 'mind.made-world.link' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.ALIYUN_SSH_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
        run: bash deploy/ssh-deploy.sh
