name: CI and deploy to Alibaba Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy or inspect the server without changing it
        type: choice
        options: [deploy, inspect]
        default: deploy
        required: true
      architecture:
        description: Alibaba Cloud server CPU architecture
        type: choice
        options: [x64, arm64]
        default: x64
        required: true

permissions:
  contents: read

concurrency:
  group: mind-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test, package and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Package self-contained Linux release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode != 'inspect'
        env:
          DEPLOY_ARCH: ${{ inputs.architecture }}
        run: npm run package:release -- --sha "$GITHUB_SHA" --arch "$DEPLOY_ARCH"
      - name: Deploy through SSH and verify HTTPS
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ vars.ALIYUN_HOST || '47.90.84.89' }}
          DEPLOY_USER: ${{ vars.ALIYUN_USER || 'root' }}
          DEPLOY_PORT: ${{ vars.ALIYUN_PORT || '22' }}
          DEPLOY_DOMAIN: ${{ vars.MIND_DOMAIN || 'mind.made-world.link' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.ALIYUN_SSH_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
          DEPLOY_MODE: ${{ inputs.mode || 'deploy' }}
        run: bash deploy/ssh-deploy.sh
